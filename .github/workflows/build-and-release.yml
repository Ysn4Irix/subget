name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --continue

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        id: sign_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Unsigned APK not found, checking for release APK..."
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          OUTPUT_NAME="Subget-${GITHUB_REF_NAME}.apk"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            OUTPUT_NAME="Subget-release.apk"
          fi
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No custom keystore secret provided. Creating standalone signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias subget -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Subget, OU=Mobile, O=Subget, L=Cinema, S=Modern, C=US" -storepass android -keypass android
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="subget"
            KEY_PASSWORD="android"
          fi
          
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass pass:"$KEY_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out "$OUTPUT_NAME" "$APK_PATH"
          
          sha256sum "$OUTPUT_NAME" > "${OUTPUT_NAME}.sha256"
          echo "SIGNED_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          echo "CHECKSUM=${OUTPUT_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subget-release-apk
          path: |
            ${{ env.SIGNED_APK }}
            ${{ env.CHECKSUM }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SIGNED_APK }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
